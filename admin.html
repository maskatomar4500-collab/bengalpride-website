<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Bengal Pride</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9f9f9; color: #0B241C; }
        .forest-bg { background: #2F4F4F; }
        .gold-text { color: #D4AF37; }
        .badge { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; }
        .table-header { background: #E8F5E9; }
        .table-row { background: #FFFFFF; transition: background 0.3s; }
        .table-row:hover { background: #F1F8E9; }
        .search-input { border: 2px solid #A5D6A7; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-6xl mx-auto">
        <header class="forest-bg text-white p-8 rounded-3xl shadow-xl flex flex-col md:flex-row justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold">Bengal Pride Admin</h1>
                <p class="opacity-80">Manage your handicraft orders</p>
            </div>
            <div class="flex gap-10 mt-6 md:mt-0">
                <div class="text-center">
                    <p class="text-xs opacity-80 uppercase">Orders</p>
                    <p id="statOrders" class="text-3xl font-bold gold-text">0</p>
                </div>
                <div class="text-center border-l border-white/10 pl-10">
                    <p class="text-xs opacity-80 uppercase">Revenue</p>
                    <p id="statRevenue" class="text-3xl font-bold gold-text">৳0</p>
                </div>
            </div>
        </header>

        <input type="text" id="search" onkeyup="search()" placeholder="Search by customer name or phone..." class="w-full p-4 mb-6 rounded-2xl shadow-sm search-input outline-none focus:ring-2 focus:ring-emerald-900 text-lg">

        <div class="bg-white rounded-3xl shadow-sm overflow-hidden">
            <table class="w-full text-left">
                <thead class="table-header border-b text-xs font-bold uppercase tracking-widest text-stone-600">
                    <tr>
                        <th class="p-5">Order ID</th>
                        <th class="p-5">Customer Details</th>
                        <th class="p-5">Product Purchased</th>
                        <th class="p-5">Total Paid</th>
                        <th class="p-5">Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dynamic content will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const pass = prompt("Enter Admin Password:");
        if (pass !== "BPADMIN2024") {
            alert("Wrong Password");
            window.location.href = "index.html";
        }

        const URL = 'https://sheetdb.io/api/v1/p9t48utvkfbtp';

        async function load() {
            try {
                const res = await fetch(URL);
                const data = await res.json();
                document.getElementById('statOrders').innerText = data.length;
                document.getElementById('statRevenue').innerText = "৳" + data.reduce((s, o) => s + parseInt(o.Grand_Total), 0).toLocaleString();
                document.getElementById('tableBody').innerHTML = data.map(o => `
                    <tr class="table-row border-b">
                        <td class="p-5 font-bold text-emerald-900">${o.Order_ID}</td>
                        <td class="p-5"><p class="font-bold">${o.Customer_Name}</p><p class="text-xs opacity-50">${o.Phone}</p></td>
                        <td class="p-5 text-sm">${o.Product_Name}</td>
                        <td class="p-5 font-bold">৳${o.Grand_Total}</td>
                        <td class="p-5"><span class="badge ${o.Status === 'Pending' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'}">${o.Status}</span></td>
                    </tr>`).join('');
            } catch(e) { console.error("Error loading dashboard", e); }
        }

        function search() {
            let input = document.getElementById('search').value.toUpperCase();
            let rows = document.getElementById('tableBody').getElementsByTagName('tr');
            for (let row of rows) {
                row.style.display = row.innerText.toUpperCase().includes(input) ? "" : "none";
            }
        }
        load();
    </script>
</body>
</html>
