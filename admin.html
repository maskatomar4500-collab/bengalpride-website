<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Bengal Pride</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .font-poppins { font-family: 'Poppins', sans-serif; }
        .font-inter { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar for table container */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-inter bg-[#FAF9F6] text-stone-800 antialiased min-h-screen flex flex-col selection:bg-stone-200">

    <!-- Glassmorphic Navbar -->
    <nav class="sticky top-0 z-50 bg-[#FAF9F6]/80 backdrop-blur-md border-b border-stone-200/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2 text-stone-800">
                    <iconify-icon icon="solar:leaf-linear" width="24" stroke-width="1.5"></iconify-icon>
                    <span class="font-poppins font-semibold text-sm tracking-widest uppercase">BengalPride</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="h-8 w-8 rounded-full bg-stone-100 border border-stone-200 flex items-center justify-center text-xs font-medium text-stone-500">
                        <iconify-icon icon="solar:user-rounded-linear" width="16" stroke-width="1.5"></iconify-icon>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
        
        <!-- Header & Stats Section -->
        <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-8 mb-10">
            
            <!-- Page Title -->
            <div class="space-y-1">
                <h1 class="text-3xl sm:text-4xl font-semibold font-poppins tracking-tight text-stone-900">
                    Overview
                </h1>
                <p class="text-sm text-stone-500">Manage your eco-conscious handicraft orders.</p>
            </div>

            <!-- Stats Grid -->
            <div class="flex flex-col sm:flex-row gap-4 sm:gap-6">
                <!-- Orders Stat -->
                <div class="bg-white rounded-2xl p-6 border border-stone-100 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)] w-full sm:w-48 flex flex-col justify-between group hover:-translate-y-0.5 hover:shadow-[0_8px_20px_-6px_rgba(0,0,0,0.08)] transition-all duration-300 ease-out">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-medium text-stone-400 uppercase tracking-wider">Total Orders</span>
                        <div class="h-8 w-8 rounded-full bg-stone-50 flex items-center justify-center text-stone-400 group-hover:text-stone-700 transition-colors">
                            <iconify-icon icon="solar:box-linear" width="18" stroke-width="1.5"></iconify-icon>
                        </div>
                    </div>
                    <p id="statOrders" class="text-3xl font-semibold font-poppins tracking-tight text-stone-800">
                        <iconify-icon icon="solar:refresh-linear" width="20" class="animate-spin text-stone-300"></iconify-icon>
                    </p>
                </div>

                <!-- Revenue Stat -->
                <div class="bg-white rounded-2xl p-6 border border-stone-100 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)] w-full sm:w-48 flex flex-col justify-between group hover:-translate-y-0.5 hover:shadow-[0_8px_20px_-6px_rgba(0,0,0,0.08)] transition-all duration-300 ease-out">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-medium text-stone-400 uppercase tracking-wider">Revenue</span>
                        <div class="h-8 w-8 rounded-full bg-stone-50 flex items-center justify-center text-stone-400 group-hover:text-stone-700 transition-colors">
                            <iconify-icon icon="solar:wallet-linear" width="18" stroke-width="1.5"></iconify-icon>
                        </div>
                    </div>
                    <p id="statRevenue" class="text-3xl font-semibold font-poppins tracking-tight text-stone-800">
                        <iconify-icon icon="solar:refresh-linear" width="20" class="animate-spin text-stone-300"></iconify-icon>
                    </p>
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full max-w-md mb-6">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-stone-400">
                <iconify-icon icon="solar:magnifer-linear" width="20" stroke-width="1.5"></iconify-icon>
            </div>
            <input 
                type="text" 
                id="search" 
                onkeyup="search()" 
                placeholder="Search orders, names, or phones..." 
                class="w-full pl-11 pr-4 py-3 bg-white border border-stone-200 rounded-xl text-sm text-stone-800 placeholder-stone-400 focus:outline-none focus:border-stone-300 focus:ring-4 focus:ring-stone-100 transition-all shadow-sm"
            >
        </div>

        <!-- Data Table -->
        <div class="bg-white border border-stone-200/60 rounded-2xl shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)] overflow-hidden">
            <div class="overflow-x-auto hide-scrollbar">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead class="bg-stone-50/50 border-b border-stone-200/60 text-xs font-medium uppercase tracking-wider text-stone-500">
                        <tr>
                            <th class="py-4 px-6">Order ID</th>
                            <th class="py-4 px-6">Customer Details</th>
                            <th class="py-4 px-6">Product</th>
                            <th class="py-4 px-6">Total Paid</th>
                            <th class="py-4 px-6">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-stone-100 text-sm">
                        <!-- Loading State -->
                        <tr>
                            <td colspan="5" class="py-12 text-center text-stone-400">
                                <div class="flex flex-col items-center justify-center gap-2">
                                    <iconify-icon icon="solar:refresh-linear" width="24" class="animate-spin"></iconify-icon>
                                    <span class="text-xs">Loading organic data...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // Security check
        const pass = prompt("Enter Admin Password:");
        if (pass !== "BPADMIN2024") {
            alert("Wrong Password");
            window.location.href = "index.html";
        }

        const URL = 'https://sheetdb.io/api/v1/p9t48utvkfbtp';

        async function load() {
            try {
                const res = await fetch(URL);
                const data = await res.json();
                
                // Update Stats
                document.getElementById('statOrders').innerText = data.length;
                document.getElementById('statRevenue').innerText = "৳" + data.reduce((s, o) => s + parseInt(o.Grand_Total), 0).toLocaleString();
                
                // Update Table
                document.getElementById('tableBody').innerHTML = data.map(o => {
                    // Extract first letter for avatar
                    const initial = o.Customer_Name ? o.Customer_Name.charAt(0).toUpperCase() : '?';
                    
                    // Status Badge Logic
                    const isPending = o.Status === 'Pending';
                    const statusClass = isPending 
                        ? 'bg-orange-50 text-orange-700 border-orange-200/60' 
                        : 'bg-emerald-50 text-emerald-700 border-emerald-200/60';
                    const statusIcon = isPending 
                        ? 'solar:clock-circle-linear' 
                        : 'solar:check-circle-linear';

                    return `
                    <tr class="group hover:bg-stone-50/50 transition-colors duration-200">
                        <td class="py-4 px-6">
                            <span class="font-poppins font-medium text-stone-600">#${o.Order_ID}</span>
                        </td>
                        <td class="py-4 px-6">
                            <div class="flex items-center gap-3">
                                <div class="h-9 w-9 rounded-full bg-[#FAF9F6] border border-stone-200 flex items-center justify-center text-xs font-semibold text-stone-600">
                                    ${initial}
                                </div>
                                <div>
                                    <p class="font-medium text-stone-800">${o.Customer_Name}</p>
                                    <p class="text-xs text-stone-500 mt-0.5 flex items-center gap-1">
                                        <iconify-icon icon="solar:phone-linear" width="12"></iconify-icon>
                                        ${o.Phone}
                                    </p>
                                </div>
                            </div>
                        </td>
                        <td class="py-4 px-6 text-stone-600">
                            ${o.Product_Name}
                        </td>
                        <td class="py-4 px-6 font-poppins font-medium text-stone-800">
                            ৳${parseInt(o.Grand_Total).toLocaleString()}
                        </td>
                        <td class="py-4 px-6">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border ${statusClass}">
                                <iconify-icon icon="${statusIcon}" width="14"></iconify-icon>
                                ${o.Status}
                            </span>
                        </td>
                    </tr>
                `}).join('');
            } catch(e) { 
                console.error("Error loading dashboard", e); 
                document.getElementById('tableBody').innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 text-center text-red-500 text-sm">Failed to load data. Please try again.</td>
                    </tr>
                `;
            }
        }

        function search() {
            let input = document.getElementById('search').value.toUpperCase();
            let rows = document.getElementById('tableBody').getElementsByTagName('tr');
            for (let row of rows) {
                // Ensure we don't hide the loading or error states if they are present and search is empty
                if(row.innerText.includes("Loading organic data") || row.innerText.includes("Failed to load")) continue;
                
                row.style.display = row.innerText.toUpperCase().includes(input) ? "" : "none";
            }
        }

        // Initialize
        load();
    </script>
</body>
</html>
